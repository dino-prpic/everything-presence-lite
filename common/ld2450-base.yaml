esphome:
  on_boot: 
    priority: -100
    then:
      - button.press: get_mmwave_firmware
      - text_sensor.template.publish:
          id: entry_exit_last_decision
          state: "Idle"
      - text_sensor.template.publish:
          id: entry_exit_last_zone
          state: "None"
      - text_sensor.template.publish:
          id: entry_exit_status
          state: "Starting"
      - binary_sensor.template.publish:
          id: zone1_occupancy
          state: false 
      - binary_sensor.template.publish:
          id: zone2_occupancy
          state: false 
      - binary_sensor.template.publish:
          id: zone3_occupancy
          state: false 
      - binary_sensor.template.publish:
          id: zone4_occupancy
          state: false
globals:
  - id: mmwave_update_time
    type: unsigned long
    restore_value: False
    initial_value: '0'
  - id: mmwave_update_interval
    type: unsigned long
    restore_value: False
    initial_value: '250'
  - id: target1_last_update
    type: unsigned long
    initial_value: '0'
    restore_value: False
  - id: target1_reset
    type: int
    initial_value: "1"
    restore_value: False
  - id: entities_update_count
    type: unsigned int
    restore_value: False
    initial_value: '0'
  - id: entities_update_max_count
    type: unsigned int
    restore_value: False
    initial_value: '0'
  - id: extra_entities
    type: unsigned int
    restore_value: False
    initial_value: '0'
  - id: assumed_present_until_ms
    type: unsigned long
    restore_value: False
    initial_value: '0'
  - id: assumed_present_active
    type: bool
    restore_value: False
    initial_value: 'false'
  # Entry/exit tracking: while this is above zero every new target is accepted
  # wherever it appears in the room, so people already inside at boot (or when
  # Entry Exit is turned on) are counted. It counts down to zero.
  - id: entry_gate_grace_ms
    type: unsigned long
    restore_value: False
    initial_value: '15000'
  - id: tracker_reset
    type: bool
    restore_value: False
    initial_value: 'true'
  - id: last_target_x_mm
    type: float
    restore_value: False
    initial_value: '0'
  - id: last_target_y_mm
    type: float
    restore_value: False
    initial_value: '0'
  - id: poly_zone_1_points
    type: std::vector<float>
    restore_value: False
    initial_value: 'std::vector<float>()'
  - id: poly_zone_2_points
    type: std::vector<float>
    restore_value: False
    initial_value: 'std::vector<float>()'
  - id: poly_zone_3_points
    type: std::vector<float>
    restore_value: False
    initial_value: 'std::vector<float>()'
  - id: poly_zone_4_points
    type: std::vector<float>
    restore_value: False
    initial_value: 'std::vector<float>()'
  - id: poly_exclusion_1_points
    type: std::vector<float>
    restore_value: False
    initial_value: 'std::vector<float>()'
  - id: poly_exclusion_2_points
    type: std::vector<float>
    restore_value: False
    initial_value: 'std::vector<float>()'
  - id: poly_entry_1_points
    type: std::vector<float>
    restore_value: False
    initial_value: 'std::vector<float>()'
  - id: poly_entry_2_points
    type: std::vector<float>
    restore_value: False
    initial_value: 'std::vector<float>()'


interval:
  - interval: 1s
    then:
      - lambda: |-
          unsigned long now = millis();
          unsigned long timeout_ms = (unsigned long)(id(aggressive_timeout).state * 1000);
          if (id(aggressive_target_clearing).state) {
            if ((now - id(target1_last_update)) > timeout_ms) {
              if (id(target1_reset) == 0) {
                if (id(target1_active).state == true) {
                  ESP_LOGD("custom", "No update in 3s, clearing");
                  id(reboot_mmwave_sensor).press();
                  id(target1_reset) = 1;
                }
              }
            }
          }

text_sensor:
  - platform: template
    disabled_by_default: True
    name: "mmWave Firmware"
    id: "firmware_version"
    entity_category: diagnostic
  - platform: template
    name: "Entry Exit Last Decision"
    id: entry_exit_last_decision
    entity_category: diagnostic
    disabled_by_default: true
  - platform: template
    name: "Entry Exit Last Entry Zone"
    id: entry_exit_last_zone
    entity_category: diagnostic
    disabled_by_default: true
  - platform: template
    name: "Entry Exit Status"
    id: entry_exit_status
    entity_category: diagnostic
    icon: "mdi:door-open"

button:
  - platform: template
    id: get_mmwave_firmware
    internal: True
    entity_category: config
    disabled_by_default: True
    on_press: 
      then:
      - switch.turn_on: mmwave_configuration
      - delay: 1s
      - uart.write:
          id: uart_bus
          data: [0xFD, 0xFC, 0xFB, 0xFA, 0x02, 0x00, 0xA0, 0x00, 0x04, 0x03, 0x02, 0x01]
      - lambda: |-
          uint8_t response[20];
          if (id(uart_bus).read_array(response, 20)) {
            int firmware_major = response[13];
            int firmware_minor = response[12];
            char firmware_version_str[32];
            sprintf(firmware_version_str, "V%d.%02d", firmware_major, firmware_minor);
            id(firmware_version).publish_state(std::string(firmware_version_str));
          } else {
            id(firmware_version).publish_state("Unknown");
          }
      - switch.turn_off: mmwave_configuration
      - delay: 1s
  - platform: template
    name: "Reboot mmWave Sensor"
    id: reboot_mmwave_sensor
    disabled_by_default: True
    entity_category: config
    on_press:
      then:
      - switch.turn_on: mmwave_configuration
      - delay: 1s  
      - uart.write:
          id: uart_bus
          data: [0xFD, 0xFC, 0xFB, 0xFA, 0x02, 0x00, 0xA3, 0x00, 0x04, 0x03, 0x02, 0x01]
  - platform: template
    name: "Factory Reset mmWave Sensor"
    id: factory_reset_mmwave_sensor
    disabled_by_default: True
    entity_category: config
    on_press:
      then:
      - logger.log: "Performing Factory Reset"
      - switch.turn_on: mmwave_configuration
      - delay: 2s
      - uart.write:
          id: uart_bus
          data: [0xFD, 0xFC, 0xFB, 0xFA, 0x02, 0x00, 0xA2, 0x00, 0x04, 0x03, 0x02, 0x01]
      - delay: 2s
      - switch.turn_off: mmwave_configuration
      - delay: 2s
      - button.press: reboot_mmwave_sensor

switch:
  - platform: template
    name: "mmWave Configuration Mode"
    id: mmwave_configuration
    disabled_by_default: True
    internal: True
    entity_category: config
    optimistic: true
    restore_mode: DISABLED
    turn_on_action:
      - uart.write:
          id: uart_bus
          data: [0xFD, 0xFC, 0xFB, 0xFA, 0x04, 0x00, 0xFF, 0x00, 0x01, 0x00, 0x04, 0x03, 0x02, 0x01]
    turn_off_action:
      - uart.write:
          id: uart_bus
          data: [0xFD, 0xFC, 0xFB, 0xFA, 0x02, 0x00, 0xFE, 0x00, 0x04, 0x03, 0x02, 0x01]

  - platform: template
    name: "mmWave Bluetooth"
    id: bluetooth_switch
    optimistic: true
    disabled_by_default: True
    entity_category: config
    turn_on_action:
      - switch.turn_on: mmwave_configuration
      - delay: 2s
      - uart.write:
          id: uart_bus
          data: [0xFD, 0xFC, 0xFB, 0xFA, 0x04, 0x00, 0xA4, 0x00, 0x01, 0x00, 0x04, 0x03, 0x02, 0x01]  # Turn on Bluetooth
      - delay: 2s
      - button.press: reboot_mmwave_sensor  # Reboot after enabling Bluetooth
      - delay: 2s
      - switch.turn_off: mmwave_configuration

    turn_off_action:
      - switch.turn_on: mmwave_configuration
      - delay: 2s
      - uart.write:
          id: uart_bus
          data: [0xFD, 0xFC, 0xFB, 0xFA, 0x04, 0x00, 0xA4, 0x00, 0x00, 0x00, 0x04, 0x03, 0x02, 0x01]  # Turn off Bluetooth
      - delay: 2s
      - button.press: reboot_mmwave_sensor  # Reboot after enabling Bluetooth
      - delay: 2s
      - switch.turn_off: mmwave_configuration

  - platform: template
    name: "Stale Target Reset"
    id: aggressive_target_clearing
    restore_mode: RESTORE_DEFAULT_OFF 
    optimistic: True
    entity_category: config

  - platform: template
    name: "Upside Down Mounting"
    id: inverse_mounting
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: True
    entity_category: config
    icon: "mdi:rotate-180"

  - platform: template
    name: "Entry Exit Enabled"
    id: entry_exit_enabled
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    entity_category: config
    on_turn_on:
      - lambda: |-
          id(tracker_reset) = true;
          id(entry_gate_grace_ms) = 15000;
    on_turn_off:
      - lambda: |-
          id(tracker_reset) = true;

