          }

          if (update_entities && !p3_detected && !target_masked) {
            bool preventClear3 = id(entry_exit_enabled).state && !any_now && prev_detected[2];
            switch (id(extra_entities)) {
              case 5:
                if (!hold_prev && !preventClear3) {
                  if (id(target3_speed).state != 0) {
                    id(target3_speed).publish_state(0);
                  }
                  if (id(target3_resolution).state != 0) {
                    id(target3_resolution).publish_state(0);
                  }
                }
              case 4:
                if (!hold_prev && !preventClear3) {
                  if (id(target3_distance).state != 0) {
                    id(target3_distance).publish_state(0);
                  }
                  if (id(target3_angle).state != 0) {
                    id(target3_angle).publish_state(0);
                  }
                }
              case 3:
                if (!hold_prev && !preventClear3) {
                  id(target3_active).publish_state(false);
                }
              case 2:
              case 1:
                if (!hold_prev && !preventClear3) {
                  if (id(target3_x).state != 0) {
                    id(target3_x).publish_state(0);
                  }
                  if (id(target3_y).state != 0) {
                    id(target3_y).publish_state(0);
                  }
                }
            }
          }

          // -----------------------------------------------------------------
          // Entry/exit gated tracking (active when "Entry Exit Enabled" is on)
          //
          // People can only come into or leave the room through an entry zone:
          //  * A target that first appears outside an entry zone is a false
          //    detection (window, curtain, plant moving in the wind...). It is
          //    followed so it stays rejected, but never counts as occupancy.
          //  * A confirmed target that disappears outside an entry zone has not
          //    left: the sensor lost a still person. It is held at its last
          //    position until it is seen again or Assume Present Timeout ends.
          //  * A confirmed target that disappears inside an entry zone has left.
          //
          // With no entry zone drawn, targets are accepted anywhere and every
          // disappearance is held (there is no way out to check against).
          // During the first 15 s after boot, or after turning Entry Exit on,
          // targets are accepted anywhere so people already inside are counted.
          // -----------------------------------------------------------------
          enum TrackState : uint8_t { TRK_FREE = 0, TRK_ACTIVE, TRK_HELD, TRK_PHANTOM };
          struct Track {
            uint8_t state;
            float x, y;          // last known position
            float bx, by;        // where a false detection first appeared
            float travel;        // furthest a false detection has moved from bx/by
            unsigned long seen;  // last time a detection was matched to it
          };
          static const int MAX_TRACKS = 8;
          // A confirmed target missing for less than this keeps its state silently,
          // so single dropped frames neither start a hold nor count as an exit.
          static const unsigned long COAST_MS = 1500;
          // A false detection is remembered this long after it was last seen, so
          // one that flickers on and off stays rejected instead of re-reporting.
          static const unsigned long PHANTOM_LINGER_MS = 3000;
          static Track tracks[MAX_TRACKS] = {};

          const bool gate_on = id(entry_exit_enabled).state;
          const bool e1_valid = id(poly_entry_1_points).size() >= 6;
          const bool e2_valid = id(poly_entry_2_points).size() >= 6;
          const bool have_entry = e1_valid || e2_valid;
          const unsigned long now_ms = millis();
          bool detected_now[3] = {p1_detected, p2_detected, p3_detected};
          bool any_detected_now = p1_detected || p2_detected || p3_detected;

          if (id(tracker_reset) || !gate_on) {
            for (int t = 0; t < MAX_TRACKS; t++) tracks[t].state = TRK_FREE;
            id(tracker_reset) = false;
          }

          auto entry_zone_of = [&](float x, float y) -> int {
            if (e1_valid && point_in_poly(x, y, id(poly_entry_1_points))) return 1;
            if (e2_valid && point_in_poly(x, y, id(poly_entry_2_points))) return 2;
            return 0;
          };
          auto dist = [](float ax, float ay, float bx, float by) -> float {
            float dx = ax - bx, dy = ay - by;
            return sqrtf(dx * dx + dy * dy);
          };
          auto report = [&](const char *decision, int zone, float x, float y) {
            id(entry_exit_last_decision).publish_state(decision);
            id(entry_exit_last_zone).publish_state(zone == 1 ? "Entry 1" : (zone == 2 ? "Entry 2" : "None"));
            id(entry_exit_last_target_x).publish_state(x);
            id(entry_exit_last_target_y).publish_state(y);
            ESP_LOGI("entry_exit", "%s at x=%.0f y=%.0f (entry zone %d)", decision, x, y, zone);
          };

          if (gate_on) {
            const float match_gate = id(track_match_distance).state;
            const float reacquire_gate = id(track_reacquire_distance).state;
            const float promote_dist = id(false_detection_promote_distance).state;
            const unsigned long hold_ms = (unsigned long) (id(assume_present_timeout_s).state * 1000.0f);
            const bool in_grace = now_ms < id(entry_gate_grace_until);

            int det_track[3] = {-1, -1, -1};
            bool track_matched[MAX_TRACKS] = {};

            // Match detections to existing tracks, nearest pair first.
            //  pass 0: confirmed targets (moving or held) within match distance
            //  pass 1: known false detections within match distance
            //  pass 2: confirmed targets within reacquire distance (a held person
            //          who shifted while invisible, or a large jump between frames)
            // Confirmed targets get first pick so a person passing a flapping
            // curtain is not mistaken for it.
            for (int pass = 0; pass < 3; pass++) {
              const float gate = (pass == 2) ? reacquire_gate : match_gate;
              while (true) {
                int best_d = -1, best_t = -1;
                float best = gate;
                for (int d = 0; d < 3; d++) {
                  if (!detected_now[d] || det_track[d] >= 0) continue;
                  for (int t = 0; t < MAX_TRACKS; t++) {
                    if (track_matched[t]) continue;
                    const uint8_t st = tracks[t].state;
                    const bool eligible = (pass == 1) ? (st == TRK_PHANTOM)
                                                      : (st == TRK_ACTIVE || st == TRK_HELD);
                    if (!eligible) continue;
                    const float dd = dist(det_x[d], det_y[d], tracks[t].x, tracks[t].y);
                    if (dd <= best) { best = dd; best_d = d; best_t = t; }
                  }
                }
                if (best_d < 0) break;
                det_track[best_d] = best_t;
                track_matched[best_t] = true;
              }
            }

            // Move matched tracks to their new positions.
            for (int d = 0; d < 3; d++) {
              const int t = det_track[d];
              if (t < 0) continue;
              Track &tr = tracks[t];
              tr.x = det_x[d];
              tr.y = det_y[d];
              tr.seen = now_ms;
              if (tr.state == TRK_HELD) {
                tr.state = TRK_ACTIVE;
                report("Target Reacquired", 0, tr.x, tr.y);
              } else if (tr.state == TRK_PHANTOM) {
                const float moved = dist(tr.x, tr.y, tr.bx, tr.by);
                if (moved > tr.travel) tr.travel = moved;
                if (promote_dist > 0 && tr.travel >= promote_dist) {
                  // It walked like a person. If someone is being held it is most
                  // likely them, so take over that hold instead of adding a person.
                  int held = -1;
                  float held_d = 1e9f;
                  for (int h = 0; h < MAX_TRACKS; h++) {
                    if (tracks[h].state != TRK_HELD || track_matched[h]) continue;
                    const float hd = dist(tr.x, tr.y, tracks[h].x, tracks[h].y);
                    if (hd < held_d) { held_d = hd; held = h; }
                  }
                  if (held >= 0) tracks[held].state = TRK_FREE;
                  tr.state = TRK_ACTIVE;
                  report("False Detection Promoted", 0, tr.x, tr.y);
                }
              }
            }

            // Detections nobody claimed start new tracks.
            for (int d = 0; d < 3; d++) {
              if (!detected_now[d] || det_track[d] >= 0) continue;
              const int ez = entry_zone_of(det_x[d], det_y[d]);
              const bool genuine = ez != 0 || !have_entry || in_grace;
              int slot = -1;
              for (int t = 0; t < MAX_TRACKS && slot < 0; t++) {
                if (tracks[t].state == TRK_FREE) slot = t;
              }
              if (slot < 0 && genuine) {
                // Full: a real entry outranks a remembered false detection, then
                // the oldest hold.
                unsigned long oldest = 0xFFFFFFFFUL;
                for (int pref = 0; pref < 2 && slot < 0; pref++) {
                  const uint8_t want = pref == 0 ? TRK_PHANTOM : TRK_HELD;
                  for (int t = 0; t < MAX_TRACKS; t++) {
                    if (track_matched[t] || tracks[t].state != want) continue;
                    if (tracks[t].seen < oldest) { oldest = tracks[t].seen; slot = t; }
                  }
                }
              }
              if (slot < 0) continue;
              Track &tr = tracks[slot];
              tr.state = genuine ? TRK_ACTIVE : TRK_PHANTOM;
              tr.x = tr.bx = det_x[d];
              tr.y = tr.by = det_y[d];
              tr.travel = 0;
              tr.seen = now_ms;
              track_matched[slot] = true;
              det_track[d] = slot;
              if (genuine) {
                if (ez != 0) report("Entered", ez, tr.x, tr.y);
              } else {
                report("False Detection Rejected", 0, tr.x, tr.y);
              }
            }

            // Tracks without a detection this frame.
            for (int t = 0; t < MAX_TRACKS; t++) {
              Track &tr = tracks[t];
              if (tr.state == TRK_FREE || track_matched[t]) continue;
              const unsigned long missing = now_ms - tr.seen;
              if (tr.state == TRK_PHANTOM) {
                if (missing > PHANTOM_LINGER_MS) tr.state = TRK_FREE;
              } else if (tr.state == TRK_ACTIVE) {
                if (missing < COAST_MS) continue;
                const int ez = entry_zone_of(tr.x, tr.y);
                if (ez != 0) {
                  tr.state = TRK_FREE;
                  report("Valid Exit", ez, tr.x, tr.y);
                } else if (hold_ms == 0) {
                  tr.state = TRK_FREE;
                  report("Lost (Hold Disabled)", 0, tr.x, tr.y);
                } else {
                  tr.state = TRK_HELD;
                  report("Hold Started", 0, tr.x, tr.y);
                }
              } else if (tr.state == TRK_HELD) {
                if (missing >= hold_ms) {
                  tr.state = TRK_FREE;
                  report("Hold Expired", 0, tr.x, tr.y);
                }
              }
            }
          }

          // ---- Outputs ----------------------------------------------------
          int tracked_count = 0, held_count = 0, rejected_count = 0;
          unsigned long hold_remaining_ms = 0;
          bool occ_now = any_detected_now;
          if (gate_on) {
            // Only confirmed targets (moving or held) count; false detections
            // never turn occupancy or zones on.
            zone1_count = zone2_count = zone3_count = zone4_count = 0;
            const unsigned long hold_ms = (unsigned long) (id(assume_present_timeout_s).state * 1000.0f);
            for (int t = 0; t < MAX_TRACKS; t++) {
              const Track &tr = tracks[t];
              if (tr.state == TRK_PHANTOM) {
                if (tr.seen == now_ms) rejected_count++;
                continue;
              }
              if (tr.state != TRK_ACTIVE && tr.state != TRK_HELD) continue;
              tracked_count++;
              if (tr.state == TRK_HELD) {
                held_count++;
                const unsigned long missing = now_ms - tr.seen;
                const unsigned long left = missing < hold_ms ? hold_ms - missing : 0;
                if (left > hold_remaining_ms) hold_remaining_ms = left;
              }
              if (point_in_poly(tr.x, tr.y, id(poly_zone_1_points))) zone1_count++;
              if (point_in_poly(tr.x, tr.y, id(poly_zone_2_points))) zone2_count++;
              if (point_in_poly(tr.x, tr.y, id(poly_zone_3_points))) zone3_count++;
              if (point_in_poly(tr.x, tr.y, id(poly_zone_4_points))) zone4_count++;
            }
            occ_now = tracked_count > 0;
          }

          if (update_entities && id(extra_entities) >= 2) {
            if (id(zone1_target_count).state != zone1_count) {
              id(zone1_target_count).publish_state(zone1_count);
            }
            if (id(zone2_target_count).state != zone2_count) {
              id(zone2_target_count).publish_state(zone2_count);
            }
            if (id(zone3_target_count).state != zone3_count) {
              id(zone3_target_count).publish_state(zone3_count);
            }
            if (id(zone4_target_count).state != zone4_count) {
              id(zone4_target_count).publish_state(zone4_count);
            }
            if (id(occupancy_mask_1_target_count).state != occupancy_mask_1_count) {
              id(occupancy_mask_1_target_count).publish_state(occupancy_mask_1_count);
            }
            if (id(occupancy_mask_2_target_count).state != occupancy_mask_2_count) {
              id(occupancy_mask_2_target_count).publish_state(occupancy_mask_2_count);
            }
          }

          if (id(entry_exit_tracked_targets).state != tracked_count) {
            id(entry_exit_tracked_targets).publish_state(tracked_count);
          }
          if (id(entry_exit_held_targets).state != held_count) {
            id(entry_exit_held_targets).publish_state(held_count);
          }
          if (id(entry_exit_rejected_targets).state != rejected_count) {
            id(entry_exit_rejected_targets).publish_state(rejected_count);
          }

          id(occupancy).publish_state(occ_now);
          const bool hold_active = held_count > 0;
          hold_prev = hold_active;
          id(assumed_present_active) = hold_active;
          id(assumed_present_until_ms) = hold_active ? now_ms + hold_remaining_ms : 0;
          id(assumed_present).publish_state(hold_active);
          const float remain_s = (float) (hold_remaining_ms / 1000UL);
          if (id(assumed_present_remaining_s).state != remain_s) {
            id(assumed_present_remaining_s).publish_state(remain_s);
          }
          id(zone1_occupancy).publish_state(zone1_count > 0);
          id(zone2_occupancy).publish_state(zone2_count > 0);
          id(zone3_occupancy).publish_state(zone3_count > 0);
          id(zone4_occupancy).publish_state(zone4_count > 0);
          prev_detected[0] = p1_detected;
          prev_detected[1] = p2_detected;
          prev_detected[2] = p3_detected;
