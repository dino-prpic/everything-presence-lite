                    if (id(target3_angle).state != p3_angle) {
                      id(target3_angle).publish_state(p3_angle);
                    }
                    if (id(target3_distance).state != p3_distance) {
                      id(target3_distance).publish_state(p3_distance);
                    }
                  case 3:
                    id(target3_active).publish_state(true);
                  case 2:
